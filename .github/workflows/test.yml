# Runs every test on every push and pull request. A red cross on GitHub means something broke.
# Nothing is published from here.
name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - name: Logic, content and screen tests
        run: npx vitest run

      - name: Build
        run: npx vite build

      - name: Install the test browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests (desktop and phone)
        run: npx playwright test

      - name: Keep the browser test report if anything failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
